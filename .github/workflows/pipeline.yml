name: Testes da API gestão de alunos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 26 * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm i

      - name: Start API server
        run: |
          npm start 

      - name: Execute tests
        run: npm test