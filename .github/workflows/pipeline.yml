name: Testes da API gestão de alunos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 26 * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm i

      - name: Start API server
        run: |
          npm start > server.log 2>&1 &

          npx wait-on http://127.0.0.1:3000

      - name: Execute tests
        run: npm test

      - name: Show server logs
        if: always()
        run: cat server.log